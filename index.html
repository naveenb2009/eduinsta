<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235eead4%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237c6cf6%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22url%28%23g%29%22/%3E%3Cpath%20d%3D%22M208%20160%20L368%20256%20L208%20352%20Z%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M128%20120%20L240%2072%20L352%20120%20L240%20168%20Z%22%20fill%3D%22%230b0f1e%22%20opacity%3D%22.85%22/%3E%3Ccircle%20cx%3D%22352%22%20cy%3D%22136%22%20r%3D%2221%22%20fill%3D%22%23facc15%22/%3E%3C/svg%3E">
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22EduInsta%22%2C%22short_name%22%3A%22EduInsta%22%2C%22description%22%3A%22Educational%20short-video%20learning%20app%22%2C%22start_url%22%3A%22.%22%2C%22scope%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%2305060F%22%2C%22theme_color%22%3A%22%2305060F%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A//www.w3.org/2000/svg%2522%2520viewBox%253D%25220%25200%2520512%2520512%2522%253E%253Cdefs%253E%253ClinearGradient%2520id%253D%2522g%2522%2520x1%253D%25220%2522%2520y1%253D%25220%2522%2520x2%253D%25221%2522%2520y2%253D%25221%2522%253E%253Cstop%2520offset%253D%25220%2522%2520stop-color%253D%2522%25235eead4%2522/%253E%253Cstop%2520offset%253D%25221%2522%2520stop-color%253D%2522%25237c6cf6%2522/%253E%253C/linearGradient%253E%253C/defs%253E%253Crect%2520width%253D%2522512%2522%2520height%253D%2522512%2522%2520rx%253D%2522112%2522%2520fill%253D%2522url%2528%2523g%2529%2522/%253E%253Cpath%2520d%253D%2522M208%2520160%2520L368%2520256%2520L208%2520352%2520Z%2522%2520fill%253D%2522%2523fff%2522/%253E%253Cpath%2520d%253D%2522M128%2520120%2520L240%252072%2520L352%2520120%2520L240%2520168%2520Z%2522%2520fill%253D%2522%25230b0f1e%2522%2520opacity%253D%2522.85%2522/%253E%253Ccircle%2520cx%253D%2522352%2522%2520cy%253D%2522136%2522%2520r%253D%252221%2522%2520fill%253D%2522%2523facc15%2522/%253E%253C/svg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image/svg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
<style>
*{box-sizing:border-box}
:root{--brand-teal:#5eead4;--brand-purple:#7c6cf6;--brand-gold:#facc15;--brand-dark:#05060f}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:var(--brand-dark);color:#fff;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;height:100dvh;position:relative;
  background:
    radial-gradient(1100px 650px at 12% -8%,rgba(94,234,212,.20),transparent 60%),
    radial-gradient(950px 620px at 108% 8%,rgba(124,108,246,.22),transparent 55%),
    linear-gradient(180deg,#05060f 0%,#0b0f1f 55%,#05060f 100%)}

/* ---------- Header / bottom nav ---------- */
header{height:58px;position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(8,10,20,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(94,234,212,.16)}
.logo{font-weight:800;font-size:20px;color:#5eead4;background:linear-gradient(90deg,var(--brand-teal),var(--brand-purple));-webkit-background-clip:text;background-clip:text}
@supports (-webkit-background-clip:text) or (background-clip:text){.logo{color:transparent}}
.logoMark{width:30px;height:30px;flex:none;display:block}
.headerLeft{display:flex;align-items:center;gap:9px}
.headerBtns{display:flex;gap:8px}
.iconBtn{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:50%;width:38px;height:38px;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.notifBadge{position:absolute;top:-3px;right:-3px;background:#ff4d4f;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:800;border:1.5px solid #05060f}
.notifActions{display:flex;gap:8px;margin:2px 0 10px}
.notifActions button{flex:1;border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px;font-size:12px}
.notifList{max-height:55dvh;overflow:auto}
.notifItem{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;border-top:1px solid #f0f0f0;background:#fff;padding:12px 4px;text-align:left;position:relative}
.notifItem:first-child{border-top:0}
.notifItem.unread{background:#f4fbfa}
.notifIcon{font-size:19px;flex:none;margin-top:1px}
.notifBody{flex:1;min-width:0}
.notifBody b{display:block;font-size:13px}
.notifBody div{font-size:12px;color:#555;margin-top:2px;line-height:1.4}
.notifBody small{display:block;color:#999;margin-top:5px;font-size:11px}
.notifDot{width:8px;height:8px;border-radius:50%;background:#5eead4;flex:none;margin-top:6px}
.bottom{background:rgba(6,8,16,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(94,234,212,.14)}

/* ---------- Auth gate (shown before first sign-in) ---------- */
.app.authGateMode header,.app.authGateMode .bottom{display:none}
.authGate{position:fixed;inset:0;z-index:40;overflow:auto;padding:40px 22px;display:flex;flex-direction:column;align-items:center;color:#fff;
  background:
    radial-gradient(900px 560px at 20% 0%,rgba(94,234,212,.24),transparent 60%),
    radial-gradient(800px 520px at 100% 100%,rgba(124,108,246,.26),transparent 55%),
    linear-gradient(180deg,#05060f 0%,#0c1024 100%)}
.authGateLogoRow{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.authGateLogoMark{width:60px;height:60px}
.authGateLogo{font-weight:800;font-size:28px;color:#5eead4;background:linear-gradient(90deg,var(--brand-teal),var(--brand-purple));-webkit-background-clip:text;background-clip:text}
@supports (-webkit-background-clip:text) or (background-clip:text){.authGateLogo{color:transparent}}
.authGateTag{color:#aaa;font-size:13px;margin-bottom:26px;text-align:center}
.authGateCard{width:100%;max-width:420px;background:rgba(17,19,32,.86);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.authGateTabs{display:flex;gap:5px;background:#1c1c1c;padding:4px;border-radius:12px;margin-bottom:16px}
.authGateTabs button{flex:1;border:0;padding:10px;border-radius:9px;background:transparent;color:#999;font-weight:700}
.authGateTabs button.on{background:linear-gradient(90deg,var(--brand-teal),var(--brand-purple));color:#04101a}
.authGate .field{background:#1a1a1a;border:1px solid #333;color:#fff}
.authGate .field::placeholder{color:#888}
.passwordField{position:relative}
.passwordField .field{padding-right:44px}
.passwordToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:inherit;font-size:16px;width:34px;height:34px;opacity:.85}
.fieldError{color:#ff6b6b;font-size:12px;margin:-3px 0 8px 2px}
.pwHint{display:block;font-size:11px;color:#888;margin:-4px 0 8px 2px;line-height:1.4}
.authGateLinks{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.authGateLinks button{background:transparent;border:0;color:#5eead4;font-size:12px}
.termsRow{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#bbb;margin:10px 0}
.termsRow input{margin-top:3px}
.authGateHint{font-size:11px;color:#777;text-align:center;margin-top:14px;line-height:1.5}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;background:#090909;border-top:1px solid #292929;display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
.nav{flex:1;border:0;background:none;color:#aaa;font-size:11px}
.nav b{display:block;font-size:21px;margin-bottom:3px}
.nav.active{color:#5eead4}

/* ---------- Home feed / reels ---------- */
.homeTabs{position:fixed;z-index:25;top:66px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.homeTab{border:0;background:transparent;color:#666;padding:8px 14px;border-radius:18px;font-size:13px;font-weight:700;white-space:nowrap}
.homeTab.active{background:#111;color:#fff}
.feed{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;padding-top:58px;padding-bottom:70px}
.reel{height:calc(100vh - 128px);height:calc(100dvh - 128px);min-height:460px;scroll-snap-align:start;position:relative;background:#101010;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel video{width:100%;height:100%;object-fit:cover;background:#111}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(0,0,0,.82) 100%);pointer-events:none}
.playPauseBtn{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.reel.paused .playPauseBtn,.reel:active .playPauseBtn{opacity:1}
.playPrompt{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;background:rgba(0,0,0,.85);color:#fff;padding:13px 18px;font-weight:700;box-shadow:0 3px 14px #0008}
.info{position:absolute;left:15px;right:76px;bottom:18px;z-index:3}
.creator{font-weight:700;font-size:16px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.follow{border:1px solid #5eead4;color:#5eead4;background:transparent;border-radius:14px;padding:4px 9px;font-size:12px}
.follow.on{background:#5eead4;color:#042f2b;border-color:#5eead4}
.title{font-size:18px;font-weight:700;margin:8px 0}
.meta{font-size:13px;color:#ccc;line-height:1.4}
.actions{position:absolute;right:10px;bottom:18px;z-index:4;display:flex;flex-direction:column;gap:12px}
.act{width:52px;border:0;background:rgba(20,20,20,.78);color:#fff;border-radius:14px;padding:8px 4px}
.act span{display:block;font-size:21px}
.act small{font-size:10px;display:block;margin-top:2px}
.act.liked{color:#ff5d73}
.act.saved{color:#5eead4}
.act.soundOn{color:#5eead4}

/* ---------- Panels / generic UI ---------- */
.panel{position:fixed;z-index:15;inset:58px 0 70px;background:linear-gradient(165deg,#f2fbf9 0%,#f6f4fd 45%,#fdf6ef 100%);color:#111;overflow:auto;padding:18px}
.panel h2{margin-top:0}
.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}
.chip{white-space:nowrap;border:1px solid #ccc;background:#fff;color:#111;border-radius:18px;padding:8px 12px}
.chip.on{background:#111;color:#fff}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}
/* Scoped so it only styles plain action buttons. Without :not(), this rule
   overrode .switch/.chip/.networkBtn (higher specificity) and stretched them
   into full-width black bars inside settings cards. */
.card button:not(.switch):not(.chip):not(.networkBtn):not(.passwordToggle):not(.close):not(.optionBtn):not(.btnSecondary):not(.btnDanger){margin-top:8px;border:0;border-radius:9px;padding:8px 10px;background:#111;color:#fff;width:100%}
.field{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:10px;background:#fff;color:#111}
textarea.field{resize:vertical}
.btnSecondary{width:100%;border:1px solid #d8d8d8;background:#fff;color:#333;border-radius:11px;padding:12px;font-weight:700;margin-top:8px}
.btnSecondary:active{background:#f2f2f2}
.btnDanger{width:100%;border:1px solid #f0bcbc;background:#fff;color:#b3261e;border-radius:11px;padding:12px;font-weight:700;margin-top:8px}
/* Safety net: any button in a sheet or panel that has no class of its own
   still gets a proper look instead of the raw browser default. */
.sheet > button:not([class]),
.detailBody > button:not([class]),
.panel > button:not([class]){width:100%;border:1px solid #d8d8d8;background:#fff;color:#333;border-radius:11px;padding:12px;font-weight:700;margin-top:8px}
.primary{background:#111;color:#fff;border:0;padding:12px 16px;border-radius:10px}
.empty{padding:30px;text-align:center;color:#666}
.modal{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end}
.sheet{background:#fff;color:#111;width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:82dvh;overflow:auto}
.sheet h3{margin-top:0}
.close{border:0;background:#f0f0f0;border-radius:50%;width:34px;height:34px;font-size:20px}
.optionList button,.optionBtn{display:block;width:100%;border:1px solid #ddd;background:#fff;color:#111;border-radius:10px;padding:11px;text-align:left;margin:6px 0}
.searchBox{display:flex;gap:8px}
.hidden{display:none!important}
.otpBanner{position:fixed;z-index:300;left:50%;bottom:92px;transform:translateX(-50%);width:min(92vw,360px);background:#0f1729;color:#fff;border:1px solid #5eead4;border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6);text-align:center}
.otpBannerTop{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9fb;letter-spacing:.04em;text-transform:uppercase}
.otpBannerTop button{background:transparent;border:0;color:#9aa;font-size:20px;line-height:1;padding:0 2px}
.otpCode{font-size:34px;font-weight:800;letter-spacing:.22em;margin:6px 0 2px;color:#5eead4;font-family:monospace}
.otpTargetLine{font-size:12px;color:#aab;margin-bottom:10px;word-break:break-all}
.otpFillBtn{width:100%;border:0;border-radius:10px;padding:11px;background:linear-gradient(90deg,#5eead4,#7c6cf6);color:#04101a;font-weight:800}
.otpWhy{font-size:10px;color:#7e8aa0;margin-top:9px;line-height:1.45}
.toast{position:fixed;z-index:200;bottom:88px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:20px;border:1px solid #444;max-width:86vw;text-align:center;font-size:13px}

.searchInput{width:100%;padding:13px 15px;border:1px solid #ccc;border-radius:12px;background:#fff;color:#111;caret-color:#111;outline:none;font-size:16px;margin-bottom:8px}
.searchInput::placeholder{color:#888}
.searchResults{margin-top:6px}
.searchReel{display:flex;gap:12px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:9px;margin:9px 0;overflow:hidden;cursor:pointer}
.searchReel video{width:105px;height:145px;object-fit:cover;border-radius:10px;background:#111;flex:none}
.searchReelInfo{padding:5px 3px;min-width:0}
.searchReelInfo b{font-size:14px;line-height:1.25;display:block}
.searchMeta{font-size:11px;color:#666;margin:6px 0}
.searchDesc{font-size:12px;color:#444;line-height:1.3;margin-bottom:8px}
.searchReelInfo .primary{font-size:12px;padding:8px 10px;width:auto}

.commentHeader{padding:0 0 13px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.commentHeader h3,.commentHeader b{margin:0 0 3px;display:block}
.commentHeader small{color:#777;display:block;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.commentList{max-height:45dvh;overflow:auto;padding:2px 0;min-height:120px}
.commentRow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.commentAvatar{width:38px;height:38px;flex:none;border-radius:50%;background:#e7e7e7;display:flex;align-items:center;justify-content:center;font-weight:700;color:#333}
.commentBody{font-size:14px;line-height:1.4}
.commentBody b{font-size:13px}
.commentBody small{display:block;color:#999;margin-top:4px}
.commentsEmpty{padding:35px 10px!important;line-height:1.8}
.commentComposer{padding:12px 0 0;border-top:1px solid #eee;display:flex;gap:8px;margin-top:8px}
.commentComposer input{flex:1;border:1px solid #ddd;border-radius:22px;padding:11px 14px;outline:none}
.commentComposer button{width:44px;border:0;border-radius:50%;background:#111;color:#fff;font-size:18px}

/* ---------- Profile / settings ---------- */
.profileTopBar,.detailHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 14px}
.profileTopBar h2,.detailHead h2{margin:0;flex:1}
.profileBack,.profileGear,.detailHead button{border:0;background:#eee;color:#111;border-radius:10px;width:38px;height:38px;font-size:22px}
.profileGear{font-size:18px}
.profileHero{display:flex;align-items:center;gap:14px;padding:5px 0 14px}
.profileHero h2{margin:0 0 4px}
.profileAvatar{width:64px;height:64px;border-radius:50%;background:#111;color:#5eead4;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;flex:none}
.profileAvatar.big{width:96px;height:96px}
.erProfilePhoto{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;flex:none}
.erProfilePhoto.big{width:96px;height:96px}
.muted{color:#777}
.profileStats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid #ddd;border-radius:13px;margin-bottom:12px;overflow:hidden}
.profileStats button{border:0;background:#fff;border-right:1px solid #eee;padding:11px 3px;text-align:center}
.profileStats button:last-child{border-right:0}
.profileStats b{display:block;font-size:17px}
.profileStats small{color:#777;font-size:10px}
.profileActions{display:flex;gap:9px;margin:4px 0 13px}
.profileActions button{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px;font-weight:700}
.filterNote{font-size:12px;color:#666;margin:7px 0 12px;line-height:1.5}
.profileTabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:14px}
.profileTabs button{flex:1;border:0;background:none;padding:12px;font-weight:700;color:#777;border-bottom:2px solid transparent}
.profileTabs button.selected{color:#111;border-bottom-color:#111}
.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profileCard{background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;overflow:hidden}
.profileCard b{display:block;font-size:13px;margin:7px 2px 3px}
.profileCard small{display:block;color:#777;font-size:11px;margin:0 2px 7px}

/* Explicit references, rather than relying on the browser's implicit
   id-based global lookup (window.main / window.overlay). Both work in
   practice, but explicit is safer and removes any doubt. */

   at any point later, show it visibly in the page instead of silently
   leaving a blank screen with no clue what happened. */
window.addEventListener('error',function(e){
  showFatalError((e && e.error && e.error.stack) || (e && e.message) || 'Unknown error');
});
window.addEventListener('unhandledrejection',function(e){
  showFatalError((e && e.reason && e.reason.stack) || (e && e.reason) || 'Unknown promise rejection');
});
function showFatalError(details){
  let box=document.getElementById('fatalErrorBox');
  if(!box){
    box=document.createElement('div');

}

/* ---------------- Small utilities ---------------- */
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(x){return escapeHtml(x)}
function uniq(a){return [...new Set((a||[]).map(x=>String(x).trim()).filter(Boolean))]}
function norm(x){return String(x??'').trim().toLowerCase().replace(/\s+/g,' ')}
/* Safe localStorage wrappers - some browsing contexts (sandboxed iframes,
   strict privacy modes, certain file:// setups) throw on localStorage
   access entirely. Every read/write in this app goes through these so a
   blocked localStorage degrades to "nothing persists" instead of a fatal
   error that takes the whole page down. */
function lsSet(key,value){try{localStorage.setItem(key,value)}catch{}}
function lsGetRaw(key){try{return localStorage.getItem(key)}catch{return null}}
function readJSON(key,fallback){try{const v=lsGetRaw(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
function toast(t){
  const x=document.createElement("div");
  x.className="toast";
  x.textContent=t;
  document.body.appendChild(x);
  setTimeout(()=>x.remove(),1800);
}

const NOTIF_PREF_KEY={follower:'notifyFollowers',comment:'notifyComments',learning:'notifyLearning',system:'notifySystem',security:'loginAlerts'};
function addNotification(type,title,body){

}

   feed only ever calls buildFeedWithAds()/AdManager methods, so a real ad SDK

   Ad inventory has two sources, exactly like most ad-supported apps:
   1) Paid advertiser campaigns (see "Advertise on EduInsta" below) - real
      bookings with a price, a duration, and a payment behind them.

      paid campaign is currently active, so the feed always has something to

   The ca-app-pub-3940256099942544/... values are Google's official TEST

   Clicking your own live ads will get your AdMob account banned. */

/* Thin wrapper around @capacitor-community/admob. Every method is a safe
   no-op when the plugin is absent (i.e. in a browser), so nothing here can
   break the web build. */
var AdMobService={
  ready:false,
  available(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
              && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob);
  },
  plugin(){return window.Capacitor?.Plugins?.AdMob||null},
  async init(){
    if(this.ready||!ADMOB_CONFIG.enabled||!this.available())return false;
    try{
      await this.plugin().initialize({
        requestTrackingAuthorization:true,
        initializeForTesting:ADMOB_CONFIG.useTestAds
      });
      this.ready=true;
      return true;
    }catch(err){
      console.warn('AdMob init failed:',err);
      return false;   // never let an ad failure block the app
    }
  },
  /* Non-personalized ads when the user declined consent or the app is
     child-directed. Required by GDPR/Families Policy. */
  npaOptions(){
    const npa=(adState.consent!=='granted')||ADMOB_CONFIG.childDirected;
    return {npa,...(ADMOB_CONFIG.childDirected?{tagForChildDirectedTreatment:true}:{})};
  },
  async showInterstitial(){
    if(isPremium()||!shouldShowAds())return false;   // hard Premium guard
    if(!this.ready&&!await this.init())return false;
    try{
      await this.plugin().prepareInterstitial({
        adId:ADMOB_CONFIG.interstitialId,
        isTesting:ADMOB_CONFIG.useTestAds,
        ...this.npaOptions()
      });
      await this.plugin().showInterstitial();
      adState.impressions.admob_interstitial=(adState.impressions.admob_interstitial||0)+1;
      saveAdState();
      return true;
    }catch(err){
      console.warn('Interstitial failed (ignored):',err);
      return false;   // a failed ad must never interrupt the user
    }
  },
  async showBanner(){
    if(isPremium()||!shouldShowAds()||!ADMOB_CONFIG.showBanner)return false;
    if(!this.ready&&!await this.init())return false;
    try{
      await this.plugin().showBanner({
        adId:ADMOB_CONFIG.bannerId,
        isTesting:ADMOB_CONFIG.useTestAds,
        position:'BOTTOM_CENTER',
        margin:70,               // clear the bottom nav
        ...this.npaOptions()
      });
      return true;
    }catch(err){console.warn('Banner failed (ignored):',err);return false}
  },
  async hideBanner(){
    if(!this.available())return;
    try{await this.plugin().hideBanner();await this.plugin().removeBanner()}catch{}
  }
};

/* Called whenever a reel starts playing. Shows an interstitial every
   `interstitialEvery` reels - deliberately much rarer than the in-feed
   sponsored slots, because interstitials interrupt and hurt retention. */
var reelsViewedSinceAd=0;
function noteReelViewedForAds(){
  if(isPremium()||!shouldShowAds()||!AdMobService.available())return;
  /* Interstitials are OFF by default. The in-feed sponsored reel (which the
     user simply swipes past, exactly like an Instagram sponsored post) is the
     primary ad format - it needs no close button and never interrupts. */
  if(!AdConfig.interstitialsEnabled)return;
  reelsViewedSinceAd++;
  const every=Math.max(10,Number(AdConfig.interstitialEvery)||AD_DEFAULTS.interstitialEvery);
  if(reelsViewedSinceAd<every)return;
  /* Second gate: a minimum real-time gap. Reel count alone isn't enough -
     a fast scroller could otherwise hit several interstitials in a minute. */
  const gapMs=Math.max(1,Number(AdConfig.interstitialMinGapMinutes)||AD_DEFAULTS.interstitialMinGapMinutes)*60000;
  const last=Number(adState.lastInterstitialAt||0);
  if(Date.now()-last<gapMs)return;
  reelsViewedSinceAd=0;
  adState.lastInterstitialAt=Date.now();
  saveAdState();
  AdMobService.showInterstitial();
}

const AdManager={
  nextCreativeIndex:0,
  getAdForSlot(){
    /* Simulated ad-network call: occasionally "fails" so the feed's graceful
       degradation (skip the slot, never show broken/blank ad content) is a
       real, exercised code path rather than a theoretical one. */
    if(Math.random()<AdConfig.simulateFailureRate)return null;
    const paid=activeCampaigns();
    if(paid.length){
      const c=paid[this.nextCreativeIndex%paid.length];
      this.nextCreativeIndex++;
      return {id:'campaign_'+c.id,sponsor:c.sponsor,headline:c.headline,cta:c.cta,campaignId:c.id};
    }
    const creative=AD_CREATIVES[this.nextCreativeIndex%AD_CREATIVES.length];
    this.nextCreativeIndex++;
    return creative;
  },
  recordImpression(adId){
    adState.impressions[adId]=(adState.impressions[adId]||0)+1;saveAdState();
    const campaignId=String(adId).startsWith('campaign_')?Number(String(adId).slice(9)):null;
    if(campaignId){const c=adCampaigns.find(x=>x.id===campaignId);if(c){c.impressions=(c.impressions||0)+1;saveAdCampaigns()}}
  },
  recordClick(adId){
    adState.clicks[adId]=(adState.clicks[adId]||0)+1;saveAdState();
    const campaignId=String(adId).startsWith('campaign_')?Number(String(adId).slice(9)):null;
    if(campaignId){const c=adCampaigns.find(x=>x.id===campaignId);if(c){c.clicks=(c.clicks||0)+1;saveAdCampaigns()}}
    toast('Opening sponsor link (demo)');
  }
};

/* ---------------- Watch history ---------------- */
const HISTORY_LIMIT=60, HISTORY_COOLDOWN_MS=5000;
let lastRecordedId=null, lastRecordedAt=0;
function saveHistoryState(){lsSet('er_history',JSON.stringify(watchHistory))}
function recordHistory(id){
  const now=Date.now();
  if(id===lastRecordedId && (now-lastRecordedAt)<HISTORY_COOLDOWN_MS)return; // avoid spam from rapid play/pause
  lastRecordedId=id; lastRecordedAt=now;
  watchHistory=watchHistory.filter(h=>h.id!==id);
  watchHistory.unshift({id,watchedAt:now});
  if(watchHistory.length>HISTORY_LIMIT)watchHistory.length=HISTORY_LIMIT;
  saveHistoryState();
}
function clearHistory(){
  if(!confirm('Clear your watch history on this device?'))return;
  watchHistory=[]; saveHistoryState(); toast('Watch history cleared');
  if(profileTab==='history')profilePage();
}
function relativeTime(ms){
  const diff=Math.max(0,Date.now()-ms), m=Math.floor(diff/60000);
  if(m<1)return 'Just now';
  if(m<60)return `${m} min ago`;
  const h=Math.floor(m/60);
  if(h<24)return `${h} hour${h===1?'':'s'} ago`;
  const d=Math.floor(h/24);
  if(d<7)return `${d} day${d===1?'':'s'} ago`;
  return new Date(ms).toLocaleDateString();
}

(function migrateCustomInterests(){
  const libKeys=new Set(ER_INTEREST_LIBRARY.map(norm));

  lsSet('er_custom_interests',JSON.stringify(customInterests));

/* ---------------- IndexedDB (uploaded reels) ---------------- */
const ER_DB="EduInstaDB", ER_STORE="uploads";
function dbOpen(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(ER_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(ER_STORE,{keyPath:"id"});
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function dbPut(obj){
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ER_STORE,"readwrite");
    tx.objectStore(ER_STORE).put(obj);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function dbAll(){
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const req=db.transaction(ER_STORE,"readonly").objectStore(ER_STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
  });
}
async function dbGet(id){
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const req=db.transaction(ER_STORE,"readonly").objectStore(ER_STORE).get(id);
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
const objectUrlCache=new Map();
function blobUrlFor(obj){
  if(!objectUrlCache.has(obj.id))objectUrlCache.set(obj.id,URL.createObjectURL(obj.blob));
  return objectUrlCache.get(obj.id);
}
async function allReels(){
  const uploads=await dbAll();
  return reels.concat(uploads.map(u=>({...u,uploaded:true,src:blobUrlFor(u)})));
}

const HOME_TABS=['For You','All','Following'];
/* Shuffle used by the All tab so discovery isn't dominated by whoever uploaded
   most recently. Seeded per render, so the order changes each time you open it. */
function shuffleFeed(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
async function home(tab){
  if(tab)activeHomeTab=tab;
  const active=HOME_TABS.includes(activeHomeTab)?activeHomeTab:'For You';
  activeHomeTab=active;

  let list;
  if(active==='Following')      list=all.filter(r=>following.includes(r.creator));
  else if(active==='All')       list=shuffleFeed(all);   // everything, in random order
  else                          list=all.filter(r=>reelMatchesInterests(r));
  const renderList=buildFeedWithAds(list);
  const emptyMsg=active==='Following'
    ? 'Follow educational creators to see their reels here.'
    : active==='All'
      ? 'No reels have been published yet.'
      : 'No reels match your interests yet — try the All tab to see everything.';
  main.innerHTML=`
    <div class="homeTabs" role="tablist" aria-label="Home feed">
      ${HOME_TABS.map(t=>`<button type="button" class="homeTab ${active===t?'active':''}" onclick="home('${t}')" role="tab" aria-selected="${active===t}">${t}</button>`).join('')}
    </div>
    <div class="feed" id="feed">
      ${renderList.length?renderList.map(item=>item.type==='ad'?adSlotHTML(item.data):reelHTML(item.data)).join(""):`<div class="empty" style="margin-top:110px;color:#fff"><h3>No reels here</h3><p>${emptyMsg}</p>${active!=='All'?`<button type="button" class="primary" style="width:auto;margin-top:14px" onclick="home('All')">Browse all reels</button>`:''}</div>`}
    </div>`;

/* Inserts sponsored slots between organic reels - additional slots, not
   replacements, so ads never crowd out educational content. Premium users
   (or a disabled ad config) get the plain list back untouched. A slot that
   "fails to load" (AdManager.getAdForSlot() returning null) is simply
   skipped so the feed keeps scrolling without any gap or broken card. */
function buildFeedWithAds(list){
  if(!shouldShowAds()||!list.length)return list.map(r=>({type:'reel',data:r}));
  const out=[];
  list.forEach((r,i)=>{
    out.push({type:'reel',data:r});
    const position=i+1;
    if(position%AdConfig.frequency===0&&i!==list.length-1){
      const ad=AdManager.getAdForSlot();
      if(ad)out.push({type:'ad',data:ad});
    }
  });
  return out;
}

/* One IntersectionObserver instance, reused for every feed render. */
let feedObserver=null;
/* ================= Sound =================
   Sound is ON by default, but browsers and Android WebView refuse to autoplay
   audio until the user has interacted with the page. Unmuting blindly makes
   play() reject and the reel never starts.

   So: the first reel starts muted (guaranteed to play), and the moment the
   user touches the screen we unmute it and everything after. That's how
   Instagram/TikTok behave on the web. The preference itself is remembered. */
var soundOn=readJSON('er_sound_on',true);          // default: sound ON
var hasUserGesture=false;
function saveSoundPref(){lsSet('er_sound_on',JSON.stringify(soundOn))}
/* True only when we're actually allowed to play audio right now. */
function audioAllowed(){return soundOn&&hasUserGesture}

function applySoundToVideo(v){
  if(!v)return;
  v.muted=!audioAllowed();
  v.volume=1;
  const reel=v.closest('.reel');
  const btn=reel?.querySelector('.soundBtn');
  if(btn)updateSoundButton(btn,v.muted);
}
function updateSoundButton(btn,muted){
  btn.classList.toggle('soundOn',!muted);
  btn.querySelector('span').textContent=muted?'🔇':'🔊';
  btn.querySelector('small').textContent=muted?'Muted':'Sound';
}
/* First real interaction unlocks audio. Registered once, then removed. */
function unlockAudioOnFirstGesture(){
  if(hasUserGesture)return;
  hasUserGesture=true;
  if(!soundOn)return;
  const playing=[...document.querySelectorAll('.reel video')].find(v=>!v.paused);
  if(playing){
    applySoundToVideo(playing);
    if(playing.paused)playing.play().catch(()=>{});
  }
  document.querySelectorAll('.playPrompt').forEach(p=>p.remove());
}
['pointerdown','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev,unlockAudioOnFirstGesture,{once:false,passive:true});
});

const impressedAdElements=new WeakSet();
function observeVideos(){
  if(feedObserver)feedObserver.disconnect();
  feedObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.target.classList.contains('adSlot')){
        if(entry.isIntersecting&&!impressedAdElements.has(entry.target)){
          impressedAdElements.add(entry.target);
          const adId=entry.target.dataset.adId;
          if(adId)AdManager.recordImpression(adId);
        }
        return;
      }
      const v=entry.target.querySelector("video");
      if(!v)return;
      if(entry.isIntersecting){
        document.querySelectorAll(".reel video").forEach(x=>{if(x!==v){x.pause();x.muted=true}});
        applySoundToVideo(v);
        /* Sound is wanted but not yet unlocked: the reel still plays (muted),
           and we surface a one-tap prompt instead of leaving the user to
           wonder why it's silent. */
        if(soundOn&&!hasUserGesture){
          const reel=v.closest('.reel');
          if(reel)showPlaybackPrompt(reel,v);
        }
        v.play().catch(()=>{
          /* Blocked (almost always because audio isn't unlocked yet):
             fall back to muted playback so the reel still starts. */
          v.muted=true;
          v.play().catch(()=>{});
          const reel=v.closest('.reel');
          const btn=reel?.querySelector('.soundBtn');
          if(btn)updateSoundButton(btn,true);
          if(soundOn&&!hasUserGesture&&reel)showPlaybackPrompt(reel,v);
        });
      }else{
        v.pause();
      }
      updatePlayIcon(v);
    });
  },{threshold:.65});
  document.querySelectorAll(".reel").forEach(sec=>{
    feedObserver.observe(sec);
    const v=sec.querySelector("video");
    if(v){
      v.onclick=()=>{v.paused?v.play().catch(()=>{}):v.pause();updatePlayIcon(v)};
    }
  });
}
function updatePlayIcon(v){
  const reel=v?.closest('.reel'); if(!reel)return;
  const btn=reel.querySelector('.playPauseBtn');
  if(btn){btn.textContent=v.paused?'▶':'❚❚';btn.setAttribute('aria-label',v.paused?'Play reel':'Pause reel')}
  reel.classList.toggle('paused',v.paused);
}
function togglePlay(e,btn){
  e?.stopPropagation();
  const v=btn?.closest('.reel')?.querySelector('video'); if(!v)return;
  if(v.paused)v.play().catch(()=>{}); else v.pause();
  updatePlayIcon(v);
}
function toggleSound(e,btn){
  e?.stopPropagation();
  const reel=btn.closest('.reel'), v=reel?.querySelector('video'); if(!v)return;
  hasUserGesture=true;              // tapping the button IS the gesture
  soundOn=!soundOn;                 // this is a preference, not a per-reel state
  saveSoundPref();
  v.muted=!soundOn; v.volume=1;
  updateSoundButton(btn,v.muted);
  reel.querySelectorAll('.playPrompt').forEach(p=>p.remove());
  if(v.paused)v.play().catch(()=>showPlaybackPrompt(reel,v));
}
function showPlaybackPrompt(reel,v){
  if(reel.querySelector('.playPrompt'))return;
  const p=document.createElement('button');
  p.type='button'; p.className='playPrompt'; p.textContent='🔊 Tap for sound';
  p.onclick=(e)=>{
    e.stopPropagation();
    hasUserGesture=true; soundOn=true; saveSoundPref();
    v.muted=false; v.volume=1;
    v.play().then(()=>{p.remove();updatePlayIcon(v);applySoundToVideo(v)})
            .catch(()=>toast('Playback was blocked by the browser.'));
  };
  reel.appendChild(p);
}
document.addEventListener('error',e=>{if(e.target?.tagName==='VIDEO')toast('This video could not be loaded')},true);
/* Record watch history only for videos inside the main feed (.reel) - not the
   muted autoplay previews inside search results or profile thumbnails. */
document.addEventListener('play',e=>{
  if(e.target?.tagName!=='VIDEO')return;
  const reelEl=e.target.closest('.reel');
  if(!reelEl)return;
  const id=Number(reelEl.dataset.id);
  if(Number.isFinite(id)){recordHistory(id);noteReelViewedForAds()}
},true);

/* ---- Earnings model ----
   Revenue has two sources: Premium subscription payments and advertiser
   campaign payments. Both are read from records the app already keeps
   (subscription.history and adCampaigns), so the dashboard reflects real
   recorded transactions rather than invented numbers. Payment-gateway fees
   are estimated so the owner sees net, not just gross. */
const GATEWAY_FEE_RATE=0.0236; // ~2% + 18% GST, typical Indian gateway rate
function computeEarnings(){
  const subPayments=(subscription.history||[]).filter(h=>h.type==='purchased'||h.type==='renewed');
  const subGross=subPayments.reduce((sum,h)=>sum+(h.price||PREMIUM_CONFIG.plan.price),0);
  const adPayments=adCampaigns.filter(c=>c.price);
  const adGross=adPayments.reduce((sum,c)=>sum+c.price,0);
  const gross=subGross+adGross;
  const fees=Math.round(gross*GATEWAY_FEE_RATE);
  const now=Date.now(), monthAgo=now-30*86400000;
  const recent=[
    ...subPayments.filter(h=>h.at>=monthAgo).map(h=>({at:h.at,amount:h.price||PREMIUM_CONFIG.plan.price})),
    ...adPayments.filter(c=>c.startAt>=monthAgo).map(c=>({at:c.startAt,amount:c.price}))
  ];
  return {
    subGross,adGross,gross,fees,net:gross-fees,
    subCount:subPayments.length,adCount:adPayments.length,
    last30:recent.reduce((s,r)=>s+r.amount,0),
    transactions:[

/* Camera / gallery / other-location chooser, mirroring the picker pattern used
   by native reel apps. The browser can't truly distinguish "gallery" from

   straight to the device camera, so that option is meaningfully different. */
function openUploadPicker(){

function pickUploadSource(source){

function onUploadFileChosen(){
  const f=document.getElementById("upFilePicker")?.files[0], p=document.getElementById("preview"), hint=document.getElementById("uploadPickHint");
  if(!f){if(p)p.innerHTML="";return}
  if(!f.type.startsWith("video/")){if(p)p.innerHTML="<p>❌ Please choose a video file.</p>";return}
  const u=URL.createObjectURL(f);
  if(p)p.innerHTML=`<video src="${u}" controls playsinline style="width:100%;max-height:260px;border-radius:12px;background:#000"></video>`;
  if(hint)hint.innerHTML=`<b>Selected</b>${escapeHtml(f.name)}`;

var lastModerationVerdict=null;
function checkUpload(){
  const fileInput=document.getElementById("upFilePicker"), f=fileInput?.files[0], t=document.getElementById("upTitle").value.trim();
  if(!f){toast("Add a video first (camera, gallery or files)");return}
  if(!t){toast("Enter a title");return}
  if(!f.type.startsWith("video/")){toast("Please select a video file");return}
  lastModerationVerdict=null;
  if(serverMode())return runRealEducationCheck(f,t);
  return runSimulatedEducationCheck();
}
/* PROTOTYPE MODE: no backend, so nothing is actually analysed. Say so plainly
   rather than implying a real check happened. */
function runSimulatedEducationCheck(){
  document.getElementById("check").innerHTML='<p>🔎 Education Check running…</p>';
  setTimeout(()=>{
    lastModerationVerdict={status:'approved',simulated:true};
    document.getElementById("check").innerHTML=`<div class="checkResult checkPass"><b>✅ Education Check passed</b>
      <p>Simulated only — no backend is connected, so the video was not actually analysed.</p></div>
      <button type="button" class="primary" onclick="publishUpload()">Publish Reel</button>
      <p class="filterNote">Connect a backend (set API_BASE) to run the real AI check that watches the video and rejects non-educational content.</p>`;
  },700);
}
/* SERVER MODE: the video is sent to the backend, where Gemini watches it and
   decides whether it is genuinely educational and safe. Publishing is gated
   on the verdict, and the verdict is issued server-side so it can't be
   skipped from the browser. */
async function runRealEducationCheck(file,title){
  const box=document.getElementById("check");
  box.innerHTML=`<div class="checkResult checkPending"><b>🔎 Analysing your video…</b><p>Our AI is watching the video to confirm it's educational. This usually takes 10–30 seconds.</p><div class="checkSpinner"></div></div>`;
  try{
    const form=new FormData();
    form.append('video',file);
    form.append('title',title);
    form.append('userId',currentUserId());
    const res=await fetch(`${API_BASE}/api/education-check`,{method:'POST',body:form});
    const verdict=await res.json();
    lastModerationVerdict=verdict;
    renderModerationVerdict(verdict);
  }catch(err){
    /* Fail OPEN, matching the server: a connectivity problem on our side
       shouldn't stop someone publishing. */
    console.error(err);
    lastModerationVerdict={status:'approved',approved:true,unreviewed:true};
    box.innerHTML=`<div class="checkResult checkPass"><b>✅ Ready to publish</b>
      <p>We couldn't reach the review service, so this was approved by default.</p></div>
      <button type="button" class="primary" onclick="publishUpload()">Publish Reel</button>`;
  }
}
function renderModerationVerdict(v){
  const box=document.getElementById("check");
  if(v.status==='approved'){
    box.innerHTML=`<div class="checkResult checkPass"><b>✅ Education Check passed</b>
      <p>${v.unreviewed?'Automatic review was unavailable, so this was approved by default.':`Identified as <b>${escapeHtml(v.subject||v.category||'educational content')}</b>${v.confidence?` · ${Math.round(v.confidence*100)}% confidence`:''}`}</p>
      ${v.suggested_title?`<p class="suggestTitle">Suggested title: “${escapeHtml(v.suggested_title)}” <button type="button" onclick="useSuggestedTitle('${escapeAttr(v.suggested_title)}')">Use this</button></p>`:''}
      </div>
      <button type="button" class="primary" onclick="publishUpload()">Publish Reel</button>`;
    return;
  }
  box.innerHTML=`<div class="checkResult checkFail"><b>❌ Not approved</b>
    <p>${escapeHtml(v.reason||'This video does not appear to be educational content.')}</p>
    ${(v.safety_flags&&v.safety_flags.length)?`<p class="safetyFlags">Flagged: ${escapeHtml(v.safety_flags.join(', '))}</p>`:''}
    </div>
    <p class="filterNote">EduInsta only accepts educational content — subjects like science, technology, engineering, maths, medicine, history, languages and exam preparation. Please choose a different video.</p>`;
}
function useSuggestedTitle(t){
  const el=document.getElementById('upTitle');
  if(el){el.value=t;toast('Title updated')}
}
async function publishUpload(){
  const f=document.getElementById("upFilePicker")?.files[0], title=document.getElementById("upTitle")?.value.trim();
  if(!f||!title){toast("Video/title missing");return}
  /* Publishing requires a passing verdict. Prevents the Publish button being
     reached by any route that skipped the check. */
  if(!lastModerationVerdict||lastModerationVerdict.status!=='approved'){
    toast('Please complete the Education Check first');return;
  }
  const id=Date.now();
  const cat=document.getElementById("upCat").value;
  const sub=document.getElementById("upSub").value.trim()||cat;
  await dbPut({id,cat,sub,creator:profile.username,title,desc:"Uploaded by "+profile.name,blob:f});
  toast("🎉 Reel published successfully");
  addNotification('system','Reel published',`"${title}" is now live on EduInsta.`);
  await openReel(id);
}

async function doSearch(){
  const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();
  const results=document.getElementById("searchResults"); if(!results)return;
  if(!q){results.innerHTML='<div class="empty">Start typing to search.</div>';return}
  let all=[];
  try{all=await allReels()}catch{results.innerHTML='<div class="empty">Search is temporarily unavailable.</div>';return}
  const terms=q.split(/\s+/).filter(Boolean);
  const scored=all.map(r=>{
    const title=(r.title||"").toLowerCase(), sub=(r.sub||"").toLowerCase(), cat=(r.cat||"").toLowerCase();
    const desc=(r.desc||"").toLowerCase(), creator=(r.creator||"").toLowerCase();
    const hay=[title,sub,cat,desc,creator].join(" ");
    let score=0;
    terms.forEach(t=>{
      if(title.includes(t))score+=8;
      if(sub.includes(t))score+=7;
      if(cat.includes(t))score+=6;
      if(desc.includes(t))score+=4;
      if(creator.includes(t))score+=2;
      if(hay.includes(t))score+=1;
    });
    return {r,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.r);

  if(!scored.length){
    results.innerHTML=`<div class="empty">No reels found for "${escapeHtml(q)}".<br><br>Try a subject, technology, exam, creator or topic.</div>`;
    return;
  }
  results.innerHTML=scored.map(r=>`<div class="searchReel" onclick="closeOverlay();openReel(${r.id})">
    ${thumbVideoHTML(r.src)}
    <div class="searchReelInfo">
      <b>${escapeHtml(r.title)}</b>
      <div class="searchMeta">${escapeHtml(r.creator)} • ${escapeHtml(r.cat)} • ${escapeHtml(r.sub)}</div>
      <div class="searchDesc">${escapeHtml(r.desc||"Educational reel")}</div>
      <button type="button" class="primary" onclick="event.stopPropagation();closeOverlay();openReel(${r.id})">▶ Open Reel</button>
    </div>
  </div>`).join("");
}

/* A <video> renders a black frame until it has loaded metadata AND seeked to
   a real frame — which is why thumbnails showed nothing but the play icon.
   Two things fix it:
     1. preload="metadata" so the browser fetches enough to decode a frame
     2. seeking slightly into the clip, because frame 0 is often black
   We append #t=0.5 (a media fragment) for normal URLs, and for blob: URLs —
   where fragments are unreliable — seek manually once metadata arrives. */
function thumbVideoHTML(src){
  const isBlob=String(src).startsWith('blob:');
  const finalSrc=isBlob?src:`${src}#t=0.5`;
  return `<video src="${escapeAttr(finalSrc)}" muted playsinline preload="metadata" onloadedmetadata="seekThumb(this)"></video>`;
}
function seekThumb(v){
  try{
    if(v.currentTime<0.1 && v.duration && isFinite(v.duration)){
      v.currentTime=Math.min(0.5, v.duration/2);
    }
  }catch{}
}
/* Some Android WebViews still show black until the frame is painted; nudging
   the poster once the seek completes covers that case. */
document.addEventListener('seeked',e=>{
  const v=e.target;
  if(v&&v.tagName==='VIDEO'&&v.closest('.thumb, .searchReel'))v.classList.add('thumbReady');
},true);

function profileUploads(list){
  if(!list.length)return `<div class="empty profileEmpty">🎬<br><b>No uploads yet</b><br>Published reels will appear here.</div>`;
  return `<div class="profileGrid">${list.map(r=>`<div class="profileCard"><div class="thumb">${thumbVideoHTML(blobUrlFor(r))}<span>▶</span></div><b>${escapeHtml(r.title)}</b><small>${escapeHtml(r.cat)} · ${escapeHtml(r.sub)}</small><button type="button" onclick="openReel(${r.id})">Watch Reel</button></div>`).join("")}</div>`;
}
function profileDownloads(list){
  if(!list.length)return `<div class="empty profileEmpty">🔖<br><b>No downloads yet</b><br>Tap Save on a reel and it will appear here.</div>`;
  return `<div class="profileGrid">${list.map(r=>`<div class="profileCard"><div class="thumb">${thumbVideoHTML(r.src)}<span>▶</span></div><b>${escapeHtml(r.title)}</b><small>${escapeHtml(r.creator)} · ${escapeHtml(r.sub)}</small><button type="button" onclick="openReel(${r.id})">Watch Reel</button></div>`).join("")}</div>`;
}
function profileHistory(allR){
  const byId=new Map(allR.map(r=>[r.id,r]));

function handleProfilePhoto(input){
  const file=input?.files?.[0]; if(!file)return;
  if(!file.type.startsWith('image/')){toast('Please select an image file');input.value='';return}
  if(file.size>10*1024*1024){toast('Please choose an image smaller than 10 MB');input.value='';return}
  const reader=new FileReader();
  reader.onerror=()=>toast('Could not read the image');
  reader.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast('Could not process the image');
    img.onload=()=>{
      const max=512, scale=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round((img.naturalWidth||1)*scale));
      c.height=Math.max(1,Math.round((img.naturalHeight||1)*scale));
      const ctx=c.getContext('2d');
      if(!ctx){toast('Image processing is unavailable');return}
      ctx.drawImage(img,0,0,c.width,c.height);
      profile.avatarData=c.toDataURL('image/jpeg',.84);
      saveState(); toast('Profile photo updated'); editProfilePage();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function removeProfilePhoto(){
  if(!confirm('Remove your EduInsta profile photo?'))return;
  delete profile.avatarData; delete profile.avatar;
  saveState(); toast('Profile photo removed'); editProfilePage();
}
function shareProfile(){
  const text=`${profile.name} — ${profile.username} on EduInsta`;
  if(navigator.share){navigator.share({title:'EduInsta profile',text}).catch(()=>{})}
  else if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Profile text copied')).catch(()=>toast(text))}
  else{prompt('Copy this profile text',text)}
}

  const a=document.getElementById('customInterest'), b=document.getElementById('interestSearch');

/* Accessibility preferences have to actually change the interface, otherwise
   the toggles are decorative. Applied to <body> so every screen inherits them,
   and re-applied at boot because the DOM is rebuilt on each render. */
function applyAccessibilitySettings(){
  const b=document.body;
  b.classList.toggle('a11yLargeText',!!erGet('largeText',false));
  b.classList.toggle('a11yHighContrast',!!erGet('highContrast',false));
  b.classList.toggle('a11yReducedMotion',!!erGet('reducedMotion',false));
  /* Captions: apply to every existing and future <video>. */
  const wantCaptions=!!erGet('captions',true);
  document.querySelectorAll('video').forEach(v=>{
    try{
      const tracks=v.textTracks||[];
      for(let i=0;i<tracks.length;i++)tracks[i].mode=wantCaptions?'showing':'hidden';
    }catch{}
  });
}

/* ================= Navigation history =================
   Sub-pages used to hardcode where "back" went, so arriving from a different
   route dumped you somewhere you'd never been (Owner dashboard -> App config
   -> back -> Settings). This keeps a real stack instead. */
var navStack=[];
var currentPageFn=null;
/* Every page renderer calls this first so the stack knows where we are. */
function markPage(fn){currentPageFn=fn}
/* Navigate to a sub-page, remembering where we came from. */
function goTo(fn){
  if(currentPageFn&&currentPageFn!==fn)navStack.push(currentPageFn);
  if(navStack.length>20)navStack.shift();
  fn();
}
/* Go back to wherever we actually came from. */
function navBack(fallbackFn){
  const prev=navStack.pop();
  if(prev){currentPageFn=prev;prev();return}
  (fallbackFn||(()=>page('profile')))();
}
/* Switching top-level tabs resets the stack - you're starting a new journey. */
function resetNav(){navStack=[];currentPageFn=null}

/* ================= Premium subscription logic ================= */
function saveSubscription(){lsSet('er_subscription',JSON.stringify(subscription))}
/* Runs on every read of subscription status. If a paid period has actually
   elapsed (per stored timestamps) since we last checked, this either
   auto-renews (simulating a successful recurring charge) or, if the user
   already cancelled, flips the status to expired. In production this
   reconciliation would be driven by the payment provider's webhook/receipt,
   not just a local timestamp - this is the offline-prototype stand-in for
   that server-side verification step. */
function checkSubscriptionExpiry(){
  if(subscription.status==='active'&&subscription.expiresAt&&Date.now()>subscription.expiresAt){
    if(subscription.cancelAtPeriodEnd){
      subscription.status='expired';
      subscription.history=[...(subscription.history||[]),{type:'expired',at:Date.now()}];
      saveSubscription();
      addNotification('system','Subscription expired','Your EduInsta Premium has expired. Renew anytime from Premium settings.');
    }else{
      subscription.expiresAt=Date.now()+PREMIUM_CONFIG.billingCycleDays*86400000;
      subscription.renewsAt=subscription.expiresAt;
      subscription.history=[...(subscription.history||[]),{type:'renewed',at:Date.now(),planId:subscription.planId}];
      saveSubscription();
      addNotification('system','Subscription renewed',`Your EduInsta Premium was renewed for another ${PREMIUM_CONFIG.billingCycleDays} days.`);
    }
  }
}
function isPremium(){checkSubscriptionExpiry();return subscription.status==='active'}

/* In SERVER MODE the server is the authority on subscription status. This runs
   at boot and after every payment, so editing localStorage to fake Premium is
   overwritten on the next launch. In prototype mode it is a no-op. */
async function refreshSubscriptionFromServer(){
  if(!serverMode())return;
  try{
    const res=await fetch(`${API_BASE}/api/subscription/${encodeURIComponent(currentUserId())}`);
    if(!res.ok)return;
    const data=await res.json();
    subscription.status=data.status||'free';
    subscription.expiresAt=data.expiresAt||null;
    subscription.renewsAt=data.expiresAt||null;
    saveSubscription();
  }catch{ /* offline: keep the cached value rather than locking the user out */ }
}

/* ---- Payment gateway (SIMULATED) ----
   In production this would load the Razorpay Checkout.js SDK
   (https://checkout.razorpay.com/v1/checkout.js), create a secure order via a
   backend endpoint, and open Razorpay's real hosted checkout, then verify the
   payment signature server-side. No backend or live payment keys exist in
   this static prototype, so checkout is simulated locally with explicit
   Pay / Fail / Cancel outcomes, which also makes every outcome
   deterministically testable (a real gateway's result can't be).
   Shared by BOTH the Premium subscription checkout and advertiser campaign
   payments, including a standard set of payment methods (Card / UPI / Net
   Banking / Wallet), same as any mainstream Indian payment gateway offers. */
var __checkoutOnCancel=null;
function openCheckout(opts){
  if(serverMode())return openRealCheckout(opts);
  return openSimulatedCheckout(opts);
}
/* SERVER MODE: create the order on the backend (which decides the real
   amount), open Razorpay's hosted sheet, then verify the signature
   server-side. Premium is granted only if that verification passes. */
async function openRealCheckout({title,amount,type,days,onSuccess,onFailure,onCancel}){
  if(typeof Razorpay==='undefined'){
    toast('Payment library not loaded — add the Razorpay script tag');
    onFailure&&onFailure(); return;
  }
  try{
    const orderRes=await fetch(`${API_BASE}/api/create-order`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:type||'premium',userId:currentUserId(),days})
    });
    if(!orderRes.ok)throw new Error('order failed');
    const order=await orderRes.json();
    const rzp=new Razorpay({
      key:order.keyId, amount:order.amount, currency:order.currency,
      name:'EduInsta', description:title, order_id:order.orderId,
      prefill:{email:account.email||'',contact:profile.phone||''},
      theme:{color:'#5eead4'},
      handler:async function(response){
        const v=await fetch(`${API_BASE}/api/verify-payment`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({...response,userId:currentUserId(),type:type||'premium',days})
        });
        const result=await v.json();
        if(result.ok){await refreshSubscriptionFromServer();onSuccess(response.method||'card')}
        else onFailure();
      },
      modal:{ondismiss:function(){onCancel&&onCancel()}}
    });
    rzp.on('payment.failed',function(){onFailure()});
    rzp.open();
  }catch(err){
    console.error(err); toast('Could not start checkout'); onFailure&&onFailure();
  }
}
function openSimulatedCheckout({title,amount,intervalLabel,onSuccess,onFailure,onCancel}){
  __checkoutOnCancel=onCancel;
  overlay.innerHTML=`<div class="modal"><div class="sheet" onclick="event.stopPropagation()">
    <h3>Checkout</h3>
    <p class="filterNote">Simulated payment sheet (Razorpay-style). No real charge occurs in this prototype.</p>
    <div class="checkoutSummary"><b>${escapeHtml(title)}</b><span>${PREMIUM_CONFIG.currency}${amount}${intervalLabel?('/'+escapeHtml(intervalLabel)):''}</span></div>
    <div class="paymentMethods">
      <label class="payMethod"><input type="radio" name="payMethod" value="card" checked> 💳 Card</label>
      <label class="payMethod"><input type="radio" name="payMethod" value="upi"> 📱 UPI</label>
      <label class="payMethod"><input type="radio" name="payMethod" value="netbanking"> 🏦 Net Banking</label>
      <label class="payMethod"><input type="radio" name="payMethod" value="wallet"> 👛 Wallet</label>
    </div>
    <input class="field" placeholder="Card / UPI ID / bank details (demo only)" disabled>
    <button type="button" class="primary" id="checkoutPayBtn">Pay ${PREMIUM_CONFIG.currency}${amount}</button>
    <button type="button" class="optionBtn" id="checkoutFailBtn">Simulate payment failure</button>
    <button type="button" id="checkoutCancelBtn">Cancel</button>
  </div></div>`;
  document.getElementById('checkoutPayBtn').onclick=()=>{
    const method=document.querySelector('input[name="payMethod"]:checked')?.value||'card';
    closeOverlay();__checkoutOnCancel=null;onSuccess(method);
  };
  document.getElementById('checkoutFailBtn').onclick=()=>{closeOverlay();__checkoutOnCancel=null;onFailure()};
  document.getElementById('checkoutCancelBtn').onclick=()=>cancelCheckout();
}
function cancelCheckout(){
  closeOverlay();
  const cb=__checkoutOnCancel; __checkoutOnCancel=null;
  if(cb)cb();
}
function activateSubscription(paymentMethod){
  const plan=PREMIUM_CONFIG.plan;
  const now=Date.now();
  subscription={
    status:'active',
    planId:plan.id,
    paymentMethod:paymentMethod||subscription.paymentMethod||'card',
    startedAt:subscription.status==='active'?subscription.startedAt:now,
    expiresAt:now+PREMIUM_CONFIG.billingCycleDays*86400000,
    renewsAt:now+PREMIUM_CONFIG.billingCycleDays*86400000,
    cancelAtPeriodEnd:false,
    history:[...(subscription.history||[]),{type:'purchased',at:now,planId:plan.id,price:plan.price,method:paymentMethod}]
  };
  saveSubscription();
  reelsViewedSinceAd=0;
  syncAdMobWithSubscription();   // stop native ads immediately on upgrade
  addNotification('system','Welcome to Premium 👑','Your subscription is now active — enjoy an ad-free EduInsta.');
}
function recordPaymentFailure(){
  subscription.history=[...(subscription.history||[]),{type:'payment_failed',at:Date.now()}];
  saveSubscription();
  addNotification('system','Payment failed',"We couldn't process your Premium payment. Please try again.");
}
function cancelSubscription(){
  if(subscription.status!=='active')return;
  subscription.cancelAtPeriodEnd=true;
  subscription.history=[...(subscription.history||[]),{type:'cancelled',at:Date.now()}];
  saveSubscription();
  toast('Subscription will end on '+new Date(subscription.expiresAt).toLocaleDateString());
  addNotification('system','Subscription cancelled',`Your Premium will remain active until ${new Date(subscription.expiresAt).toLocaleDateString()}.`);
}
function resumeSubscription(){
  if(subscription.status!=='active'||!subscription.cancelAtPeriodEnd)return;
  subscription.cancelAtPeriodEnd=false;
  subscription.history=[...(subscription.history||[]),{type:'resumed',at:Date.now()}];
  saveSubscription();
  toast('Subscription resumed — it will auto-renew');
  addNotification('system','Subscription resumed','Your Premium will continue to renew automatically.');
}
/* Re-reads the persisted subscription record - in a real app this would
   query the App Store / Play Store / payment provider for prior purchases
   tied to the account. Here it demonstrates the same UX pattern against
   this device's local storage. */
function restorePurchases(){
  toast('Restoring purchases…');
  setTimeout(()=>{
    checkSubscriptionExpiry();
    const stored=readJSON('er_subscription',null);
    if(stored&&stored.status==='active'){
      subscription=stored;
      toast('Purchase restored — Premium is active');
    }else{
      toast('No active purchase found for this account');
    }
    if(document.getElementById('managePanel'))manageSubscriptionPage();
  },500);
}

/* ---- Advertiser portal: create a paid campaign (sponsor, headline, CTA,
   duration) at the admin-set rate card, pay for it, and track it. This is

var newCampaignDays=AdRateCard.minDurationDays;
function adCampaignsPage(){

function createAdCampaignPage(){
  markPage(createAdCampaignPage);
  newCampaignDays=AdRateCard.minDurationDays;
  main.innerHTML=`<div class="panel"><div class="detailHead"><button type="button" onclick="navBack(adCampaignsPage)">‹</button><h2>Create ad campaign</h2></div>
    <p class="filterNote">Run a sponsored placement in the EduInsta feed. Rate: ${PREMIUM_CONFIG.currency}${AdRateCard.pricePerDay}/day.</p>
    <input class="field" id="campSponsor" placeholder="Business / sponsor name">

    <div class="checkoutSummary" id="campPriceSummary"></div>

function renderDurationChips(){
  const presets=[3,7,14,30].filter(d=>d>=AdRateCard.minDurationDays&&d<=AdRateCard.maxDurationDays);
  if(!presets.length)presets.push(AdRateCard.minDurationDays);

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PHONE_RE=/^\+?[0-9]{7,15}$/;
function isValidEmail(v){return EMAIL_RE.test(String(v||'').trim())}
function isValidPhone(v){return PHONE_RE.test(String(v||'').trim())}
function isValidIdentifier(v){v=String(v||'').trim();return isValidEmail(v)||PHONE_RE.test(v)}
function digitsOnly(v){return String(v||'').replace(/\D/g,'')}

/* ---- Password policy ----
   8-32 characters, must start with a letter, and must contain at least one
   number and one special character. Enforced everywhere a password is
   CREATED (signup, reset) - not on login, which only ever checks it against
   what's already stored. */
const PASSWORD_MIN=8, PASSWORD_MAX=32;
function isValidPassword(pw){
  pw=String(pw||'');
  if(pw.length<PASSWORD_MIN||pw.length>PASSWORD_MAX)return false;
  if(!/^[A-Za-z]/.test(pw))return false;      // must start with a letter
  if(!/[0-9]/.test(pw))return false;          // at least one number
  if(!/[^A-Za-z0-9]/.test(pw))return false;   // at least one special character
  return true;
}
const PASSWORD_HINT=`${PASSWORD_MIN}-${PASSWORD_MAX} characters, start with a letter, and include at least one number and one special character.`;

function maskEmail(email){
  const [user,domain]=String(email||'').split('@');
  if(!domain)return email||'';
  return `${user.slice(0,1)}${'*'.repeat(Math.max(2,user.length-1))}@${domain}`;
}
function maskPhone(phone){
  const d=digitsOnly(phone);
  return d.length<4?(phone||''):`••••${d.slice(-4)}`;
}

/* Toggle a password-style input between hidden/visible text, used throughout
   the sign-in gate and the in-app account settings form. */
function togglePasswordVisibility(id,btn){
  const input=document.getElementById(id); if(!input)return;
  const show=input.type==='password';
  input.type=show?'text':'password';
  btn.textContent=show?'🙈':'👁';
  btn.setAttribute('aria-label',show?'Hide password':'Show password');
}

/* Best-effort, non-blocking location permission check performed right after a
   successful login/signup. Never blocks or fails the auth flow itself. */
function requestLocationPermission(){
  try{
    if(!('geolocation' in navigator))return;
    navigator.geolocation.getCurrentPosition(
      pos=>{
        erSet('locationPermission','granted');
        erSet('lastLocation',{lat:pos.coords.latitude,lng:pos.coords.longitude,at:Date.now()});
        toast('Location access granted — nearby learning suggestions enabled');
      },
      ()=>{ erSet('locationPermission','denied'); toast('Location permission denied — some local recommendations may be limited'); },
      {timeout:8000,maximumAge:60000}
    );
  }catch{ /* geolocation unsupported in this environment - ignore silently */ }
}

/* ---- One-time-password (OTP) infrastructure ----
   There is no backend or SMS/email provider wired into this static prototype,
   so delivery is SIMULATED: the "sent" code is surfaced via toast instead of a
   real message. Everything else (expiry, attempt limits, resend, verify) works
   exactly like a real OTP flow, so swapping in a real provider (e.g. an SMS/
   email API called from a backend) later only means replacing the body of
   sendOtp() - every caller and the UI around it stay the same. */
var pendingOtp=null; // {code,target,purpose,expiresAt,attempts}
const OTP_TTL_MS=5*60*1000, OTP_MAX_ATTEMPTS=5;
async function sendOtp(target,purpose){
  if(serverMode()){
    /* SERVER MODE: the backend generates and emails/SMSes the code. It is
       never sent back here, so it cannot be read out of the page. */
    pendingOtp={target,purpose,server:true};
    try{
      const res=await fetch(`${API_BASE}/api/send-otp`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({target})
      });
      const data=await res.json();
      if(!data.ok){toast(data.error||'Could not send the code');return null}
      toast(`Verification code sent to ${target}`);
    }catch{
      toast('Could not reach the server. Check your connection.');
    }
    return null;
  }
  /* PROTOTYPE MODE: no backend configured, so the code is shown on screen. */
  const code=String(Math.floor(100000+Math.random()*900000));
  pendingOtp={code,target,purpose,expiresAt:Date.now()+OTP_TTL_MS,attempts:0};
  showOtpBanner(code,target);
  return code;
}
/* The demo OTP is shown on screen (no real SMS/email without a backend).
   A normal toast vanishes in under 2 seconds, which is not long enough to
   read and type a 6-digit code - so this banner stays until dismissed, and
   offers a one-tap autofill. */
function showOtpBanner(code,target){
  document.getElementById('otpBanner')?.remove();
  const el=document.createElement('div');
  el.id='otpBanner';
  el.className='otpBanner';
  el.innerHTML=`<div class="otpBannerTop">Demo verification code<button type="button" aria-label="Dismiss" onclick="this.closest('.otpBanner').remove()">×</button></div>
    <div class="otpCode">${escapeHtml(code)}</div>
    <div class="otpTargetLine">for ${escapeHtml(target)}</div>
    <button type="button" class="otpFillBtn" onclick="autofillOtp('${escapeAttr(code)}')">Tap to fill automatically</button>
    <div class="otpWhy">Shown here because this prototype has no mail/SMS server yet. See OTP_SETUP.md to send real codes.</div>`;
  document.body.appendChild(el);
}
function autofillOtp(code){
  const input=document.getElementById('otpCodeInput');
  if(input){input.value=code;input.dispatchEvent(new Event('input',{bubbles:true}))}
  document.getElementById('otpBanner')?.remove();
}
function dismissOtpBanner(){document.getElementById('otpBanner')?.remove()}
async function verifyOtpCode(input){
  if(!pendingOtp)return{ok:false,error:'No code was requested. Please request a new one.'};
  if(pendingOtp.server){
    /* SERVER MODE: verification happens on the backend, so the code can't be
       bypassed by editing anything in the browser. */
    try{
      const res=await fetch(`${API_BASE}/api/verify-otp`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({target:pendingOtp.target,code:String(input||'').trim()})
      });
      const data=await res.json();
      return data.ok?{ok:true,purpose:pendingOtp.purpose,target:pendingOtp.target}
                    :{ok:false,error:data.error||'Incorrect code. Please try again.'};
    }catch{
      return{ok:false,error:'Could not reach the server. Check your connection.'};
    }
  }
  if(Date.now()>pendingOtp.expiresAt)return{ok:false,error:'This code has expired. Please request a new one.'};
  pendingOtp.attempts++;
  if(pendingOtp.attempts>OTP_MAX_ATTEMPTS)return{ok:false,error:'Too many incorrect attempts. Please request a new code.'};
  if(String(input||'').trim()!==pendingOtp.code)return{ok:false,error:'Incorrect code. Please try again.'};
  return{ok:true,purpose:pendingOtp.purpose,target:pendingOtp.target};
}
function clearOtp(){pendingOtp=null}
/* Generic OTP-entry step, reusable inside any container (the full-screen gate,
   an in-app modal, or a settings sub-page) so verification logic never drifts
   between the different places OTP is used (signup, forgot password, phone
   number change). */
function renderOtpStep(container,target,purpose,onSuccess,onBack){
  if(!container)return;
  container.innerHTML=`
    <p class="filterNote">We sent a 6-digit verification code to <b>${escapeHtml(target)}</b>.${serverMode()?'':' (Demo mode: the code appears in the on-screen banner — no real SMS/email is sent yet.)'}</p>
    <input class="field" id="otpCodeInput" maxlength="6" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code">
    <div class="fieldError" id="otpError"></div>
    <button type="button" class="primary" style="width:100%" id="otpVerifyBtn">Verify code</button>
    <div class="authGateLinks"><button type="button" id="otpResendBtn">Resend code</button><button type="button" id="otpBackBtn">Back</button></div>`;
  container.querySelector('#otpVerifyBtn').onclick=async()=>{
    const result=await verifyOtpCode(container.querySelector('#otpCodeInput')?.value);
    const err=container.querySelector('#otpError');
    if(!result.ok){if(err)err.textContent=result.error;return}
    if(err)err.textContent='';
    clearOtp();
    onSuccess();
  };
  container.querySelector('#otpResendBtn').onclick=()=>{sendOtp(target,purpose);toast('New code sent')};
  container.querySelector('#otpBackBtn').onclick=onBack;
}

/* ---- Shared signup/login logic used by BOTH the full-screen gate and the
   in-app "Account & sign-in" modal, so credential handling never drifts
   between the two surfaces. Validation is split out from account creation so
   the OTP step can sit in between: fields are checked BEFORE an OTP is sent,
   and the account is only actually created once the code is verified. ---- */
/* Which channel an identifier implies. One field, two possible kinds. */
function identifierType(v){
  v=String(v||'').trim();
  if(isValidEmail(v))return 'email';
  if(isValidPhone(v))return 'phone';
  return null;
}
function validateSignupFields({name,identifier,password,confirmPassword}){
  name=(name||'').trim(); identifier=(identifier||'').trim();
  password=password||''; confirmPassword=confirmPassword||'';
  const errors={};
  if(name.length<2)errors.name='Enter your full name.';
  /* Signup is email-only. SMS OTP needs TRAI DLT registration in India, so
     phone numbers are added later in Settings and verified by email instead. */
  if(!isValidEmail(identifier))errors.identifier='Enter a valid email address.';
  if(!isValidPassword(password))errors.password='Password must be '+PASSWORD_HINT;
  if(confirmPassword!==password)errors.confirmPassword='Passwords do not match.';
  return Object.keys(errors).length?{ok:false,errors}:{ok:true};
}
function performSignup({name,identifier,password}){
  name=(name||'').trim(); identifier=(identifier||'').trim();
  /* A signup creates a FRESH account record. Do NOT inherit the email or phone
     of whoever was registered before - that would leak the previous user's
     contact details into the new account and let them receive its OTPs. */
  registeredAccount={name,password,email:identifier,phone:null};
  profile.phone=null;
  lsSet('er_registered_account',JSON.stringify(registeredAccount));
  account={loggedIn:true,email:registeredAccount.email||registeredAccount.phone,name};
  lsSet('er_account',JSON.stringify(account));
  profile.name=name;
  profile.username="@"+name.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,20)||"@student";
  saveState();
  requestLocationPermission();
  addNotification('system','Welcome to EduInsta 🎉','Your account was created successfully.');
  addNotification('learning','Personalize your feed','Pick a few interests in your profile to fine-tune your For You feed.');
  FOLLOWERS_DEFAULT.forEach(u=>{
    const p=personMap()[u];
    addNotification('follower','New follower',`${p?p.name:u} started following you.`);
  });
  return{ok:true};
}
function performLogin({identifier,password}){
  identifier=(identifier||'').trim(); password=password||'';
  if(!identifier||!password)return{ok:false,error:'Enter your email/mobile and password.'};
  if(!registeredAccount)return{ok:false,error:'No account found on this device yet — please sign up first.'};
  const matchesEmail=norm(identifier)===norm(registeredAccount.email);
  const idDigits=digitsOnly(identifier);
  const matchesPhone=!!registeredAccount.phone && idDigits.length>=7 && idDigits===digitsOnly(registeredAccount.phone);
  if(!(matchesEmail||matchesPhone)||password!==registeredAccount.password)
    return{ok:false,error:'Incorrect email/mobile or password.'};
  account={loggedIn:true,email:registeredAccount.email,name:registeredAccount.name};
  lsSet('er_account',JSON.stringify(account));
  if(!profile.name||profile.name==='Your Name')profile.name=registeredAccount.name;
  saveState();
  requestLocationPermission();
  addNotification('security','New sign-in','Your account was signed in on this device.');
  return{ok:true};
}

   `forceForm` shows the login/signup form even while already logged in - needed for

var pendingModalSignupData=null;
function modalSignup(){
  const fields={name:document.getElementById("authName")?.value,identifier:document.getElementById("authIdentifier")?.value,password:document.getElementById("authPass")?.value,confirmPassword:document.getElementById("authPass2")?.value};
  const check=validateSignupFields(fields);

}

}
