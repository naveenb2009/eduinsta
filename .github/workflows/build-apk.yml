name: Build EduInsta APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android || echo "android platform already present"
          npx cap sync android

      - name: Inject AdMob APPLICATION_ID into AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "gms.ads.APPLICATION_ID" "$MANIFEST"; then
            echo "Already present, skipping"
          else
            sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' "$MANIFEST"
            echo "Injected AdMob APPLICATION_ID"
          fi
          grep -A1 "APPLICATION_ID" "$MANIFEST" || echo "WARNING: injection failed"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EduInsta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== java ==="; java -version
          echo "=== manifest ==="; cat android/app/src/main/AndroidManifest.xml 2>/dev/null || true
