      </svg>
      <div class="authGateLogo">EduInsta</div>
    </div>
    <div class="authGateTag">Sign in to continue your learning feed</div>
    <div class="authGateCard">
      <div class="authGateTabs">
        <button type="button" id="gateTabLogin" class="${gateTab==='login'?'on':''}" onclick="renderAuthGate('login')">Log in</button>
        <button type="button" id="gateTabSignup" class="${gateTab==='signup'?'on':''}" onclick="renderAuthGate('signup')">Sign up</button>
      </div>
      <div id="gateForm"></div>
      <div class="authGateHint">This is a local prototype — your account, profile and content are stored only on this device.</div>
    </div>
  </div>`;
  renderGateForm();
}
function renderGateForm(){
  const holder=document.getElementById('gateForm'); if(!holder)return;
  if(gateTab==='login'){
    holder.innerHTML=`
      <input class="field" id="gateEmail" type="email" placeholder="Email address" autocomplete="username" inputmode="email">
      <div class="passwordField"><input class="field" id="gatePass" type="password" placeholder="Password" autocomplete="current-password"><button type="button" class="passwordToggle" onclick="togglePasswordVisibility('gatePass',this)">👁</button></div>
      <div class="fieldError" id="gateError"></div>
      <div class="authGateLinks"><span></span><button type="button" onclick="openForgotPassword()">Forgot password?</button></div>
      <button type="button" class="primary" style="width:100%;margin-top:12px" onclick="gateLogin()">Log in</button>`;
  }else{
    holder.innerHTML=`
      <input class="field" id="gateName" placeholder="Full name" autocomplete="name">
      <input class="field" id="gateIdentifier" type="email" placeholder="Email address" autocomplete="email" inputmode="email">
      <small class="pwHint">We'll send a verification code to this address.</small>
      <div class="passwordField"><input class="field" id="gatePass" type="password" placeholder="Create password" autocomplete="new-password"><button type="button" class="passwordToggle" onclick="togglePasswordVisibility('gatePass',this)">👁</button></div>
      <small class="pwHint">${escapeHtml(PASSWORD_HINT)}</small>
      <input class="field" id="gatePass2" type="password" placeholder="Confirm password" autocomplete="new-password">
      <div class="fieldError" id="gateError"></div>
      <label class="termsRow"><input type="checkbox" id="gateTerms"><span>I agree to EduInsta's Terms of Use and Privacy Policy.</span></label>
      <button type="button" class="primary" style="width:100%" onclick="gateSignup()">Create account</button>`;
  }
}
function gateLogin(){
  const result=performLogin({identifier:document.getElementById('gateEmail')?.value,password:document.getElementById('gatePass')?.value});
  const err=document.getElementById('gateError');
  if(!result.ok){if(err)err.textContent=result.error;return}
  if(err)err.textContent='';
  exitAuthGate(); toast('Welcome back');
}
var pendingSignupData=null;
function gateSignup(){
  if(!document.getElementById('gateTerms')?.checked){
    const err=document.getElementById('gateError'); if(err)err.textContent='Please accept the Terms of Use and Privacy Policy to continue.';
    return;
  }
  const fields={name:document.getElementById('gateName')?.value,identifier:document.getElementById('gateIdentifier')?.value,password:document.getElementById('gatePass')?.value,confirmPassword:document.getElementById('gatePass2')?.value};
  const check=validateSignupFields(fields);
  const err=document.getElementById('gateError');
  if(!check.ok){if(err)err.textContent=Object.values(check.errors)[0];return}
  if(err)err.textContent='';
  pendingSignupData=fields;
  sendOtp(fields.identifier,'signup');
  renderOtpStep(document.getElementById('gateForm'),fields.identifier,'signup',completeGateSignup,()=>renderGateForm());
}
function completeGateSignup(){
  const result=performSignup(pendingSignupData);
  pendingSignupData=null;
  if(!result.ok){toast('Something went wrong — please try again');gateTab='signup';renderGateForm();return}
  exitAuthGate(); toast('Account created — welcome to EduInsta');
}

/* ---- Forgot password (OTP via email or phone) ---- */
function openForgotPassword(){
  const holder=document.getElementById('gateForm'); if(!holder)return;
  if(!registeredAccount){
    holder.innerHTML=`<p class="filterNote">No account was found on this device yet. Please sign up first.</p>
      <button type="button" class="primary" style="width:100%" onclick="gateTab='signup';renderGateForm()">Go to sign up</button>
      <button type="button" onclick="renderGateForm()">Back to login</button>`;
    return;
  }
  /* Offer only the channels this account actually has. Accounts created with
     a single identifier have one; a phone added later in Settings gives two. */
  const opts=[];
  if(registeredAccount.email)opts.push(`<button type="button" class="optionBtn" onclick="chooseForgotMethod('email')">📧 Email — ${escapeHtml(maskEmail(registeredAccount.email))}</button>`);
  if(registeredAccount.phone)opts.push(`<button type="button" class="optionBtn" onclick="chooseForgotMethod('phone')">📱 SMS — ${escapeHtml(maskPhone(registeredAccount.phone))}</button>`);
  holder.innerHTML=`
    <p class="filterNote">${opts.length>1?"Choose where to send your verification code.":"We'll send a verification code to:"}</p>
    <div class="optionList">${opts.join('')}</div>
    <button type="button" class="btnSecondary" onclick="renderGateForm()">Back to login</button>`;
}
function chooseForgotMethod(method){
  const target=method==='email'?registeredAccount?.email:registeredAccount?.phone;
  if(!target){toast('No phone number on file for this account');return}
  sendOtp(target,'reset');
  renderOtpStep(document.getElementById('gateForm'),target,'reset',showResetPasswordStep,openForgotPassword);
}
function showResetPasswordStep(){
  const holder=document.getElementById('gateForm'); if(!holder)return;
  holder.innerHTML=`
    <p class="filterNote">Choose a new password for your account.</p>
    <div class="passwordField"><input class="field" id="resetPass" type="password" placeholder="New password" autocomplete="new-password"><button type="button" class="passwordToggle" onclick="togglePasswordVisibility('resetPass',this)">👁</button></div>
    <small class="pwHint">${escapeHtml(PASSWORD_HINT)}</small>
    <input class="field" id="resetPass2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <div class="fieldError" id="resetError"></div>
    <button type="button" class="primary" style="width:100%" onclick="submitPasswordReset()">Update password</button>`;
}
function submitPasswordReset(){
  const p1=document.getElementById('resetPass')?.value||'', p2=document.getElementById('resetPass2')?.value||'';
  const err=document.getElementById('resetError');
  if(!isValidPassword(p1)){if(err)err.textContent='Password must be '+PASSWORD_HINT;return}
  if(p1!==p2){if(err)err.textContent='Passwords do not match.';return}
  registeredAccount.password=p1;
  lsSet('er_registered_account',JSON.stringify(registeredAccount));
  if(err)err.textContent='';
  toast('Password updated — please log in with your new password');
  addNotification('security','Password changed','Your password was reset successfully.');
  gateTab='login'; renderGateForm();
  const emailField=document.getElementById('gateEmail'); if(emailField)emailField.value=registeredAccount.email;
}
function exitAuthGate(){
  document.querySelector('.app').classList.remove('authGateMode');
  page('home');
  updateNotificationBadge();
}

/* ---- Update phone number (Settings > Account details), OTP-verified ---- */
function updatePhonePage(){
  markPage(updatePhonePage);
  main.innerHTML=`<div class="panel"><div class="detailHead"><button type="button" onclick="navBack(()=>settingDetail('accountDetails'))">‹</button><h2>Phone number</h2></div>
    <div class="detailBody" id="phoneStepContainer">
      <p class="filterNote">${profile.phone?`Current number: <b>${escapeHtml(maskPhone(profile.phone))}</b>`:'No phone number added yet.'}</p>
      <input class="field" id="newPhoneInput" placeholder="e.g. +919876543210" inputmode="tel">
      <small class="pwHint">We'll email you a code to confirm this change.</small>
      <div class="fieldError" id="phoneError"></div>
      <button type="button" class="primary" onclick="requestPhoneOtp()">Send verification code</button>
    </div>
  </div>`;
}
function requestPhoneOtp(){
  const val=document.getElementById('newPhoneInput')?.value;
  const err=document.getElementById('phoneError');
  if(!isValidPhone(val)){if(err)err.textContent='Enter a valid phone number (7-15 digits, optional +country code).';return}
  if(err)err.textContent='';
  pendingPhoneUpdate=val.trim();
  /* The confirmation code goes to the account's EMAIL, not the new number.
     Sending it by SMS would require TRAI DLT registration; emailing it still
     proves the account owner authorised the change, which is the point. */
  const target=registeredAccount?.email||account.email;
  if(!target){toast('No email on file for this account');return}
  sendOtp(target,'phone');
  renderOtpStep(document.getElementById('phoneStepContainer'),target,'phone',completePhoneUpdate,()=>updatePhonePage());
}
var pendingPhoneUpdate=null;
function completePhoneUpdate(){
  profile.phone=pendingPhoneUpdate;
  if(registeredAccount)registeredAccount.phone=pendingPhoneUpdate;
  pendingPhoneUpdate=null;
  saveState();
  if(registeredAccount)lsSet('er_registered_account',JSON.stringify(registeredAccount));
  toast('Phone number updated');
  addNotification('security','Phone number updated','Your phone number was changed successfully.');
  settingDetail('accountDetails');
}

/* ---------------- Boot ---------------- */
function boot(){
  if(account&&account.loggedIn)page('home');
  else renderAuthGate('login');
  updateNotificationBadge();
  applyAccessibilitySettings();
  /* Re-check Premium against the server (server mode only). Runs after the
     first paint so a slow network never delays startup. */
  refreshSubscriptionFromServer().then(()=>{
    if(serverMode()&&document.querySelector('.feed'))home(activeHomeTab);
    syncAdMobWithSubscription();
  });
  if(AdMobService.available())AdMobService.init().then(()=>syncAdMobWithSubscription());
}
/* Single place that decides whether native ads should be running at all.
   Called after boot and after any subscription change, so a user who just
   upgraded stops seeing ads immediately rather than on next launch. */
function syncAdMobWithSubscription(){
  if(!AdMobService.available())return;
  if(isPremium()||!shouldShowAds())AdMobService.hideBanner();
  else AdMobService.showBanner();
}
try{
  boot();
}catch(e){
  showFatalError((e&&e.stack)||e);
}
</script>
</body></html>
